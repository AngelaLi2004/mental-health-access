function featureContaining(features, longitude, latitude) {

async function goToCoordinates(longitude, latitude) {

  const id = feature.id;
  const {metric: m, kind, bgs} = tipContext.current;
  if (kind === "blockgroup") {
    const row = bgs.get(id);
    if (!row) return null;
    const label = !row.has_iso ? "No data" : row.pop === 0 ? "No residents" : `${row[`n_${m}`]} ${row[`n_${m}`] === 1 ? "provider" : "providers"}`;
    return [line(label, "strong"), line(tractLabel(id)), line(`${whole(row.pop)} residents`)];
  }
  const row = kind === "state" ? stateById.get(id) : countyById.get(id);
  if (!row) return [line("No data", "strong"), line(feature.properties.NAME ?? feature.properties.NAMELSAD ?? "")];
  return [line(percent(row[m]), "strong"), line(kind === "state" ? row.name : `${row.name}, ${row.abbr}`), line(`${whole(row[`reach_${m}`])} of ${whole(row.pop)} people`)];

const tipContext = {current: {metric: "any_15", kind: "state", bgs: new Map()}};

  features: shapes.features,
  boundaries: shapes.boundaries,

  onSelect: (feature) => mapClick.current(feature)

define({id: "70db31f9", inputs: ["geography","tipContext","metric","blockgroupById","mapClick","setArea","area","selected","select","showTab","mapView","landing","mapProviders","NO_DATA","NO_PROVIDER","countColor","stateById","countyById","percentColor","stateFeatures","countyFeatures","focus"], outputs: ["kind","fill","spotlight"], body: (geography,tipContext,metric,blockgroupById,mapClick,setArea,area,selected,select,showTab,mapView,landing,mapProviders,NO_DATA,NO_PROVIDER,countColor,stateById,countyById,percentColor,stateFeatures,countyFeatures,focus) => {

mapClick.current = (feature) => {
  if (geography === "state-pick") return setArea(feature.id);
  if (kind === "state") return setArea(feature.id === area ? null : feature.id);

}});

define({id: "2f2d53cd", inputs: ["searchText","d3","matching","reachable","safeWebsite","focus","stateById","isEmergency","html","mapView","pinDetails","whole","SERVICES","service","SERVICE_SHORT","selected","select","ui","placeName","focusRow","percent","kind","searchBox","minutes","qa","regionRows"], outputs: ["PAGE","needle","shown","providerCard","renderList","serviceTable","clearButton"], body: (searchText,d3,matching,reachable,safeWebsite,focus,stateById,isEmergency,html,mapView,pinDetails,whole,SERVICES,service,SERVICE_SHORT,selected,select,ui,placeName,focusRow,percent,kind,searchBox,minutes,qa,regionRows) => {

define({id: "32b0139e", inputs: ["kind","whole","area","percent","compact","tableState","selected","tableRows","setArea","select","mapView","html","downloadCsv","service","minutes","FileAttachment","ui","areaRow"], outputs: ["COLUMNS","idColumn","pickedId","sortedRows","pickRow","tableWrap","tableMore","tableSearchBox","tableCount","renderTable","downloadButton","factorsLink"], body: (kind,whole,area,percent,compact,tableState,selected,tableRows,setArea,select,mapView,html,downloadCsv,service,minutes,FileAttachment,ui,areaRow) => {
// All places tab: a compact table. Click a row to go there; click a column to sort.
const COLUMNS = kind === "blockgroup"
  ? [{key: "Place", label: "Neighborhood"}, {key: "Providers", label: "Providers", num: true, format: whole}, {key: "Status", label: "Status"}]
  : [
      {key: "Place", label: kind === "state" ? "State" : "County"},
      ...(kind === "county" && !area ? [{key: "State", label: ""}] : []),
      {key: "In reach", label: "In reach", num: true, format: percent},
      {key: "Without", label: "Without", num: true, format: compact},
      {key: "Providers", label: "Providers", num: true, format: whole}
    ];
const idColumn = kind === "blockgroup" ? "GEOID" : "FIPS";
if (tableState.kind !== kind || tableState.area !== area) {
  Object.assign(tableState, {kind, area, sort: kind === "blockgroup" ? "Providers" : "In reach", dir: kind === "blockgroup" ? 1 : 1, query: "", shown: 40});
}
const pickedId = kind === "state" ? area : selected?.id ?? null;

function sortedRows() {
  const query = tableState.query.trim().toLowerCase();
  const rows = query ? tableRows.filter((d) => `${d.Place} ${d.County ?? ""} ${d.State ?? ""}`.toLowerCase().includes(query)) : tableRows;
  const column = COLUMNS.find((c) => c.key === tableState.sort);
  return [...rows].sort((a, b) => {

    if (x == null && y == null) return 0;
    if (x == null) return 1;
    if (y == null) return -1;

function pickRow(row) {

const tableWrap = html`<div class="place-table-wrap"></div>`;
const tableMore = html`<button class="show-more" type="button"></button>`;
const tableSearchBox = html`<input type="search" class="pane-search" placeholder=${`Search ${kind === "blockgroup" ? "neighborhoods" : kind === "state" ? "states" : "counties"}`} aria-label="Search places">`;

function renderTable() {
  const rows = sortedRows();
  tableCount.textContent = `${whole(rows.length)} places`;
  const headers = COLUMNS.map((c) => {
    const active = c.key === tableState.sort;
    const th = html`<th class=${c.num ? "num" : ""} aria-sort=${active ? (tableState.dir > 0 ? "ascending" : "descending") : "none"}><button type="button">${c.label}<span class="sort-mark" aria-hidden="true">${active ? (tableState.dir > 0 ? "▲" : "▼") : ""}</span></button></th>`;

      if (tableState.sort === c.key) tableState.dir *= -1;

  const body = html`<tbody></tbody>`;

tableMore.onclick = () => {
  tableState.shown += 60;

};
tableSearchBox.oninput = () => {
  tableState.query = tableSearchBox.value;
  tableState.shown = 40;

const downloadButton = Object.assign(html`<button class="small-button" type="button">↓ This table</button>`, {
  onclick: () => downloadCsv(sortedRows(), `mental-health-access-${kind}-${area ?? "us"}-${service}-${minutes}min.csv`)

const factorsLink = html`<a class="small-button" href=${FileAttachment("./data/county_factors.csv").href} download="county_social_demographic_factors.csv" title="Income, education, employment, race and density by county, with access figures">↓ County factors</a>`;
ui.panes.places.replaceChildren(html`<div>
  <div class="pane-head"><h2>${kind === "state" ? "States" : kind === "county" ? "Counties" : "Neighborhoods"}${area ? ` in ${areaRow.name}` : ""}</h2>${tableCount}</div>

}});

define({id: "1e90d0df", inputs: ["aboutDialog","html","whole","qa"], body: (aboutDialog,html,whole,qa) => {

define({id: "74bfd8e6", inputs: ["createAssistant","states","counties","stateById","countyById","qa","regionRows","html","AI_ENDPOINT","setArea","showTab","goTo","SERVICE_SHORT","serviceInput","minutesInput","areaInput","SERVICES","percent","whole","EXAMPLES","AbortSignal","ui"], outputs: ["answerQuestion","CRISIS","chatLog","chatInput","chatSend","chatPanel","chatButton","toggleChat","textP","bubble","chips","placeList","factsFor","ask"], body: (createAssistant,states,counties,stateById,countyById,qa,regionRows,html,AI_ENDPOINT,setArea,showTab,goTo,SERVICE_SHORT,serviceInput,minutesInput,areaInput,SERVICES,percent,whole,EXAMPLES,AbortSignal,ui) => {
// The chat: a button in the corner that opens a small assistant panel.
const answerQuestion = createAssistant({states, counties, stateById, countyById, qa, regionRows});
const CRISIS = /suicid|kill (myself|me)|end my life|self[- ]?harm|hurt myself|want to die|自杀|轻生|伤害自己|不想活/i;
const chatLog = html`<div class="chat-log" aria-live="polite"></div>`;
const chatInput = html`<input type="text" class="chat-input" placeholder="Ask about a place…" aria-label="Ask a question" maxlength="300">`;
const chatSend = html`<button type="button" class="chat-send" aria-label="Send">➤</button>`;
const chatPanel = html`<div class="chat-panel" role="dialog" aria-label="Ask about the data" hidden>
  <div class="chat-head">
    <div><strong>Ask about the data</strong><span>${AI_ENDPOINT ? "AI answers from this map's data" : "Answers from this map's data"}</span></div>
    ${Object.assign(html`<button type="button" class="chat-close" aria-label="Close">×</button>`, {onclick: () => toggleChat(false)})}
  </div>
  ${chatLog}
  <div class="chat-row">${chatInput}${chatSend}</div>
  <div class="chat-foot">${AI_ENDPOINT ? "Questions go to an AI service to write the answer. Not medical advice." : "Not medical advice."} In a crisis, call or text 988.</div>
</div>`;
const chatButton = html`<button type="button" class="chat-fab" aria-label="Ask about the data"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-5 4v-4H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Zm3 6.5a1.5 1.5 0 1 0 0 .01Zm5 0a1.5 1.5 0 1 0 0 .01Zm5 0a1.5 1.5 0 1 0 0 .01Z"/></svg><span>Ask</span></button>`;
function toggleChat(open = chatPanel.hidden) {
  chatPanel.hidden = !open;
  chatButton.hidden = open;
  if (open) chatInput.focus();
}
chatButton.onclick = () => toggleChat(true);

const textP = (text) => Object.assign(document.createElement("p"), {textContent: text});
function bubble(role, children) {
  const box = html`<div class=${`chat-bubble ${role}`}></div>`;
  box.append(...children);
  chatLog.append(box);
  chatLog.scrollTop = chatLog.scrollHeight;
  return box;
}
function chips(list) {
  return html`<div class="chat-chips">${list.map((example) => Object.assign(html`<button type="button" class="chat-chip"></button>`, {textContent: example, onclick: () => ask(example)}))}</div>`;
}
function placeList(result) {
  if (!result.items?.length) return [];
  const list = document.createElement(result.ordered ? "ol" : "ul");
  for (const item of result.items) {
    const li = document.createElement("li");
    if (item.place) {
      const button = Object.assign(document.createElement("button"), {type: "button", className: "chat-place", textContent: item.label});
      // A state opens as its own area; a county opens zoomed in with its providers.
      button.onclick = item.place.level === "state"
        ? () => {

    } else {

  lines.push(`Lookup result: ${result.text}`);
  for (const item of result.items ?? []) lines.push(`- ${item.label}: ${item.value}`);
  for (const s of SERVICES.values()) lines.push(`US ${SERVICE_SHORT[s]}: ${percent(qa.national[`${s}_15`])} within 15 min, ${percent(qa.national[`${s}_30`])} within 30 min.`);
  return lines.join("\n").slice(0, 3500);

async function ask(question) {
  const text = question.trim();
  if (!text) return;
  chatInput.value = "";
  bubble("user", [textP(text)]);
  if (CRISIS.test(text)) {
    return bubble("bot crisis", [
      textP("If you're thinking about suicide or hurting yourself, please reach out now. Call or text 988 (Suicide & Crisis Lifeline), any time. If you're in immediate danger, call 911."),
      Object.assign(html`<a href="https://988lifeline.org" target="_blank" rel="noopener noreferrer">988lifeline.org</a>`)
    ]);
  }
  const result = answerQuestion(text, {service: serviceInput.value, minutes: minutesInput.value}, {percent, whole});
  if (!AI_ENDPOINT) return bubble("bot", [textP(result.text), ...placeList(result), ...(result.suggestions ? [chips(EXAMPLES.slice(0, 4))] : [])]);
  const pending = bubble("bot", [textP("…")]);
  try {
    const response = await fetch(AI_ENDPOINT, {
      method: "POST",
      headers: {"content-type": "application/json"},
      body: JSON.stringify({question: text, facts: factsFor(result)}),
      signal: AbortSignal.timeout(20000)
    });
    if (!response.ok) throw new Error(String(response.status));
    const {answer} = await response.json();
    pending.replaceChildren(textP(answer || result.text), ...placeList(result));
  } catch {
    // If the AI is busy or out of its free daily allowance, fall back to the lookup.
    pending.replaceChildren(textP(result.text), ...placeList(result), ...(result.suggestions ? [chips(EXAMPLES.slice(0, 4))] : []));
  }
  chatLog.scrollTop = chatLog.scrollHeight;
}

chatSend.onclick = () => ask(chatInput.value);
chatInput.addEventListener("keydown", (event) => {
  if (event.key === "Enter") ask(chatInput.value);
});
document.addEventListener("keydown", (event) => {
  if (event.key === "Escape" && !chatPanel.hidden) toggleChat(false);
});
bubble("bot", [textP("Hi! Ask about access in a state or county, or which places have the lowest access."), chips(EXAMPLES.slice(0, 4))]);
ui.chat.replaceChildren(chatButton, chatPanel);
return {answerQuestion,CRISIS,chatLog,chatInput,chatSend,chatPanel,chatButton,toggleChat,textP,bubble,chips,placeList,factsFor,ask};
}});
